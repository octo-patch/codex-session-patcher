name: Tests

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[web,dev]"

      - name: Run Python tests
        run: python -m pytest

      - name: Validate offline prompt bank
        run: python scripts/run_prompt_bank_regression.py

  build:
    needs: python-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install build dependencies
        run: python -m pip install --upgrade pip build

      - name: Build frontend
        working-directory: web/frontend
        run: npm ci && npm audit --audit-level=high && npm run build

      - name: Build wheel and source distribution
        run: python -m build

      - name: Smoke-test wheel from a clean environment
        shell: bash
        run: |
          WHEEL="$(pwd)/$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          python -m venv "$RUNNER_TEMP/codex-patcher-smoke"
          "$RUNNER_TEMP/codex-patcher-smoke/bin/python" -m pip install "$WHEEL[web]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/codex-patcher-smoke/bin/codex-patcher" --help >/dev/null
          "$RUNNER_TEMP/codex-patcher-smoke/bin/python" - <<'PY'
          from importlib.resources import files
          import codex_session_patcher.core
          import codex_session_patcher.ctf_config.installer
          import web.backend.main

          assert files("codex_session_patcher").joinpath(
              "ctf_config/prompts/ctf_optimized.md"
          ).is_file()
          assert files("web").joinpath("frontend/dist/index.html").is_file()
          print("PASS clean wheel smoke test")
          PY
